name: Build Split Open3DBench Place Download

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Install crane
        uses: imjasonh/setup-crane@v0.1

      - name: Pull image from GHCR
        run: |
          crane pull \
            --platform=linux/amd64 \
            ghcr.io/wwwwhb/open3dbench@sha256:69192fe510ab56878c0cbb0e275c76f40ab6f7a7e9dc112c4b9c3f23cf62d04e \
            open3dbench-place.tar

      - name: Split image and generate checksums
        run: |
          sha256sum open3dbench-place.tar > SHA256SUMS
          split -b 1400M -d -a 2 \
            open3dbench-place.tar \
            open3dbench-place.part-
          sha256sum open3dbench-place.part-* >> SHA256SUMS
          ls -lh open3dbench-place.part-* SHA256SUMS

      - name: Publish files as GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete place-transfer-v1 \
            --repo "${{ github.repository }}" \
            --cleanup-tag \
            --yes || true

          gh release create place-transfer-v1 \
            open3dbench-place.part-* \
            SHA256SUMS \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Open3DBench Place Image" \
            --notes "Split Docker image archive for resumable transfer."
